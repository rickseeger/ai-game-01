name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "${{ matrix.os }} / py${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install optional Windows curses wheel
        if: runner.os == 'Windows'
        run: pip install windows-curses

      - name: Smoke-run entry point (headless demo)
        run: python -m emberlight --demo

      - name: Run tests
        run: python -m unittest discover -s tests -v
